<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal Request Form</title>
    <style>
      :root {
        --trimble-yellow: #F2A900;
        --trimble-blue: #00263E;
        --trimble-blue-light: #005A9C;
        --bg-gray: #F4F6F8;
        --card-border: #E1E6EB;
      }

      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background-color: var(--bg-gray); 
        margin: 0; 
        padding: 40px 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh;
        box-sizing: border-box;
      }

      .card-container {
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        border-top: 6px solid var(--trimble-yellow);
        width: 100%;
        max-width: 700px;
        padding: 30px 35px;
      }

      h2 { color: var(--trimble-blue); margin-top: 0; margin-bottom: 8px; }
      p.subtitle { color: #555; margin-bottom: 25px; font-size: 0.95rem; }

      .system-selection-container {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
      }

      .system-btn {
        flex: 1;
        padding: 15px;
        background-color: #FAFAFA;
        color: var(--trimble-blue);
        border: 2px solid var(--card-border);
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .system-btn:hover {
        border-color: var(--trimble-blue-light);
        background-color: #F0F4F8;
      }

      .system-btn.active {
        background-color: var(--trimble-blue);
        color: white;
        border-color: var(--trimble-blue);
      }

      .form-section { margin-bottom: 18px; }
      label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--trimble-blue); }
      
      input[type="text"], input[type="email"], input[type="date"], select, textarea { 
        width: 100%; 
        padding: 10px; 
        box-sizing: border-box; 
        margin-bottom: 10px; 
        border: 1px solid #CCC; 
        border-radius: 4px;
        font-size: 14px;
      }

      input[type="text"]:focus, input[type="email"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
        border-color: var(--trimble-blue-light);
        outline: none;
      }

      .required { color: #D93025; }

      .inline-checkbox-label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .search-box {
        margin-bottom: 8px;
        border-color: var(--trimble-blue-light);
      }

      .checkbox-group {
        max-height: 350px;
        overflow-y: auto;
        border: 1px solid var(--card-border);
        padding: 12px;
        border-radius: 4px;
        background: #FAFAFA;
        margin-bottom: 15px;
      }

      .category-block { margin-bottom: 18px; }
      .category-title { font-weight: bold; margin-top: 5px; color: var(--trimble-blue); border-bottom: 2px solid var(--trimble-yellow); padding-bottom: 3px; font-size: 0.95rem; }
      .checkbox-item { font-weight: normal; display: block; margin: 6px 0; color: #333; cursor: pointer; font-size: 0.9rem; }
      .hidden { display: none !important; }

      .submit-btn { 
        background-color: var(--trimble-yellow); 
        color: var(--trimble-blue); 
        font-weight: bold;
        padding: 12px 20px; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-size: 15px; 
        width: 100%;
        margin-top: 10px;
        transition: background-color 0.2s ease;
      }

      .submit-btn:hover { background-color: #D99700; }
      #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 1rem; }
    </style>
  </head>
  <body>

    <div class="card-container">
      <h2>Customer Portal Request Form</h2>
      <p class="subtitle">Complete this form to request a new customer project portal. Your request will be processed automatically.</p>

      <label>Select System Type: <span class="required">*</span></label>
      <div class="system-selection-container">
        <button type="button" class="system-btn" id="btn-truckmate" onclick="selectSystem('truckmate', this)">TruckMate</button>
        <button type="button" class="system-btn" id="btn-tmwsuite" onclick="selectSystem('tmwsuite', this)">TMWSuite</button>
      </div>

      <div id="commonFields" class="hidden">
        
        <div class="form-section">
          <label for="submitter">Submitter: <span class="required">*</span></label>
          <select id="submitter" onchange="handleSubmitterSelectChange()" required>
            <option value="">-- Select Submitter --</option>
            <option value="Madhan Chakravarthy J">Madhan Chakravarthy J</option>
            <option value="Tyliek Clark">Tyliek Clark</option>
            <option value="__NEW__">+ Add New Submitter</option>
          </select>
        </div>

        <div class="form-section hidden" id="newSubmitterGroup">
          <label for="newSubmitterInput">Enter New Submitter Name: <span class="required">*</span></label>
          <input type="text" id="newSubmitterInput" placeholder="e.g. Jane Doe">
        </div>

        <!-- SEARCHABLE CUSTOMER DROPDOWN -->
        <div class="form-section">
          <label for="customerName">Customer Name: <span class="required">*</span></label>
          <input type="text" id="customerSearch" class="search-box" placeholder="🔎 Type to search customer name..." onkeyup="filterCustomerDropdown()">
          <select id="customerName" onchange="handleCustomerSelectChange()" required size="5" style="height: 120px;">
            <option value="">-- Choose System First --</option>
          </select>
        </div>

        <div class="form-section hidden" id="newCustomerGroup">
          <label for="newCustomerInput">Enter New Customer Name: <span class="required">*</span></label>
          <input type="text" id="newCustomerInput" placeholder="e.g. Acme Transportation Inc.">
        </div>

        <div class="form-section">
          <label for="csm">Customer Success Manager:</label>

        </div>
      </div>

      <form id="truckmateForm" class="hidden" onsubmit="submitTruckMate(event)">
        <div class="form-section">
          <label for="testUpgradeDateTm">Test Upgrade Date: <span class="required">*</span></label>
          <input type="date" id="testUpgradeDateTm" required>
        </div>

        <div class="form-section">
          <label for="goLiveDate">Go-Live Date:</label>
          <input type="date" id="goLiveDate">
        </div>

        <div class="form-section">
          <label for="tmNotes">Additional Request Notes:</label>
          <textarea id="tmNotes" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit TruckMate Request</button>
      </form>

      <form id="tmwSuiteForm" class="hidden" onsubmit="submitTMWSuite(event)">
        
        <div class="form-section">
          <label class="inline-checkbox-label">
            <input type="checkbox" id="dbRefreshCheckbox" onchange="toggleDbRefreshFields()">
            <strong>DB Refresh Required?</strong>
          </label>
        </div>

        <div class="form-section hidden" id="dbRefreshDateContainer">
          <label for="dbRefreshDate">DB Refresh Date: <span class="required">*</span></label>
          <input type="date" id="dbRefreshDate">
        </div>

        <div class="form-section">
          <label for="discoveryCallDate">Discovery Call Date:</label>
          <input type="date" id="discoveryCallDate">
        </div>

        <div class="form-section">
          <label class="inline-checkbox-label">
            <input type="checkbox" id="acceleratorUpgradeCheckbox" onchange="toggleAcceleratorFields()">
            <strong>Accelerator Upgrade Required?</strong>
          </label>
        </div>

        <div class="form-section hidden" id="testUpgradeDateContainerTmw">
          <label for="testUpgradeDateTmw">Test Upgrade Date: <span class="required">*</span></label>
          <input type="date" id="testUpgradeDateTmw">
        </div>

        <div class="form-section">
          <label for="projectedUatDate">Projected UAT Call Date:</label>
          <input type="date" id="projectedUatDate">
        </div>

        <div class="form-section">
          <label for="productSearch">Search TMWSuite Products:</label>
          <input type="text" id="productSearch" class="search-box" placeholder="Type words to search (e.g. opt trip, web estat)..." onkeyup="filterProducts()">
        </div>

        <label>Select Required Products / Modules (Multi-Select):</label>
        
        <div class="checkbox-group" id="productChecklist">
          <div class="category-block">
            <div class="category-title">Core TMWSuite Products</div>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMWSuite / TMW Suite"> TMWSuite / TMW Suite</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMWSuite PowerBuilder / NSuite core"> TMWSuite PowerBuilder / NSuite core (Powerbuilder)</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMWSuite add-ins"> TMWSuite add-ins</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Suite-SQL database"> Suite-SQL database</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMW .NET Operations"> TMW .NET Operations</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMW .NET Back Office"> TMW .NET Back Office</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Fuel TMS"> Fuel TMS / TMW Fuel Dispatch</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Accounting"> Accounting</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="TMW Web Products / Web Enterprise"> TMW Web Products / Web Enterprise</label>
          </div>

          <div class="category-block">
            <div class="category-title">Standard Services</div>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Installation"> Installation</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Master File Import"> Master File Import</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Implementation / consulting services"> Implementation / consulting services</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Database / DBA services"> Database / DBA services</label>
            <label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="Upgrade services"> Upgrade services</label>
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit TMWSuite Request</button>
      </form>

      <div id="status"></div>
    </div>

      document.addEventListener("DOMContentLoaded", function() {

    .then(res => res.json())
    .then(data => {
      if (data) {
        if (data.truckmate && data.truckmate.length > 0) {
          customerData.truckmate = Array.from(new Set([...defaultTruckmateCustomers, ...data.truckmate])).sort();

      function selectSystem(selection, btnElement) {
        activeSystem = selection;

        document.querySelectorAll('.system-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        var commonFields = document.getElementById('commonFields');
        var tmForm = document.getElementById('truckmateForm');
        var tmwForm = document.getElementById('tmwSuiteForm');
        
        document.getElementById('status').innerText = "";
        
        document.getElementById('newCustomerGroup').classList.add('hidden');
        document.getElementById('newCustomerInput').value = "";
        document.getElementById('newSubmitterGroup').classList.add('hidden');
        document.getElementById('newSubmitterInput').value = "";
        document.getElementById('submitter').value = "";
        document.getElementById('customerSearch').value = "";

        populateCustomerDropdown(selection);

        if (selection === 'truckmate') {
          commonFields.classList.remove('hidden');
          tmForm.classList.remove('hidden');
          tmwForm.classList.add('hidden');
        } else if (selection === 'tmwsuite') {
          commonFields.classList.remove('hidden');
          tmwForm.classList.remove('hidden');
          tmForm.classList.add('hidden');
        }
      }

      function populateCustomerDropdown(system) {
        var customerDropdown = document.getElementById('customerName');
        customerDropdown.innerHTML = '<option value="">-- Select Customer --</option><option value="__NEW__">+ Add New Customer</option>';

        let list = (system === 'truckmate') ? customerData.truckmate : customerData.tmwsuite;
        list.forEach(c => {
          customerDropdown.innerHTML += `<option value="${c}">${c}</option>`;
        });
      }

      // REAL-TIME SEARCH FILTER FOR CUSTOMER DROPDOWN
      function filterCustomerDropdown() {
        var filter = document.getElementById('customerSearch').value.toLowerCase().trim();
        var select = document.getElementById('customerName');
        var options = select.getElementsByTagName('option');

        for (var i = 0; i < options.length; i++) {
          var txt = options[i].text.toLowerCase();
          if (options[i].value === '' || options[i].value === '__NEW__') {
            options[i].style.display = "";
          } else {
            options[i].style.display = (txt.indexOf(filter) > -1) ? "" : "none";
          }
        }
      }

      function handleSubmitterSelectChange() {
        var selectVal = document.getElementById('submitter').value;
        var newGroup = document.getElementById('newSubmitterGroup');
        var newInput = document.getElementById('newSubmitterInput');

        if (selectVal === '__NEW__') {
          newGroup.classList.remove('hidden');
          newInput.required = true;
        } else {
          newGroup.classList.add('hidden');
          newInput.required = false;
          newInput.value = "";
        }
      }

      function handleCustomerSelectChange() {
        var selectVal = document.getElementById('customerName').value;
        var newCustGroup = document.getElementById('newCustomerGroup');
        var newCustInput = document.getElementById('newCustomerInput');

        if (selectVal === '__NEW__') {
          newCustGroup.classList.remove('hidden');
          newCustInput.required = true;
        } else {
          newCustGroup.classList.add('hidden');
          newCustInput.required = false;
          newCustInput.value = "";
        }
      }

      function toggleDbRefreshFields() {
        var isChecked = document.getElementById('dbRefreshCheckbox').checked;
        var dateContainer = document.getElementById('dbRefreshDateContainer');
        var dateInput = document.getElementById('dbRefreshDate');

        if (isChecked) {
          dateContainer.classList.remove('hidden');
          dateInput.required = true;
        } else {
          dateContainer.classList.add('hidden');
          dateInput.required = false;
          dateInput.value = "";
        }
      }

      function toggleAcceleratorFields() {
        var isChecked = document.getElementById('acceleratorUpgradeCheckbox').checked;
        var dateContainer = document.getElementById('testUpgradeDateContainerTmw');
        var dateInput = document.getElementById('testUpgradeDateTmw');

        if (isChecked) {
          dateContainer.classList.remove('hidden');
          dateInput.required = true;
        } else {
          dateContainer.classList.add('hidden');
          dateInput.required = false;
          dateInput.value = "";
        }
      }

      function filterProducts() {
        var rawInput = document.getElementById('productSearch').value.toLowerCase().trim();
        var terms = rawInput.split(/\s+/).filter(Boolean);
        
        var items = document.querySelectorAll('#productChecklist .checkbox-item');
        var blocks = document.querySelectorAll('#productChecklist .category-block');

        items.forEach(function(item) {
          var text = (item.textContent || item.innerText).toLowerCase();
          var matchesAllTerms = terms.every(function(term) {
            return text.indexOf(term) > -1;
          });
          item.style.display = matchesAllTerms ? "" : "none";
        });

        blocks.forEach(function(block) {
          var visibleItems = block.querySelectorAll('.checkbox-item:not([style*="display: none"])');
          block.style.display = (visibleItems.length === 0) ? "none" : "";
        });
      }

      function getCommonData() {
        var customerSelect = document.getElementById('customerName').value;
        var finalCustomerName = (customerSelect === '__NEW__') 
          ? document.getElementById('newCustomerInput').value.trim() 
          : customerSelect;

        var submitterSelect = document.getElementById('submitter').value;
        var finalSubmitterName = (submitterSelect === '__NEW__') 
          ? document.getElementById('newSubmitterInput').value.trim() 
          : submitterSelect;

        return {
          submitter: finalSubmitterName,
          customerName: finalCustomerName,

      function resetFormUI() {
        activeSystem = "";
        document.querySelectorAll('.system-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('commonFields').classList.add('hidden');
        document.getElementById('truckmateForm').classList.add('hidden');
        document.getElementById('tmwSuiteForm').classList.add('hidden');
      }

        var data = getCommonData();
        data.testUpgradeDate = document.getElementById('testUpgradeDateTm').value;

        data.notes = document.getElementById('tmNotes').value;

})
.catch(err => {
  statusDiv.style.color = "red";
  statusDiv.innerText = "Error: " + err.message;
});
        }
      }
