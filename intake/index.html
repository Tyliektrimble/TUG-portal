
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal Request Form</title>
  <style>
    :root {
      --trimble-yellow: #F2A900;
      --trimble-blue: #00263E;
      --trimble-blue-light: #005A9C;
      --bg-gray: #F4F6F8;
      --card-border: #E1E6EB;
    }

    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg-gray); 
      margin: 0; 
      padding: 40px 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card-container {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      border-top: 6px solid var(--trimble-yellow);
      width: 100%;
      max-width: 700px;
      padding: 30px 35px;
    }

    h2 { color: var(--trimble-blue); margin-top: 0; margin-bottom: 8px; }
    p.subtitle { color: #555; margin-bottom: 25px; font-size: 0.95rem; }

    .system-selection-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .system-btn {
      flex: 1;
      padding: 15px;
      background-color: #FAFAFA;
      color: var(--trimble-blue);
      border: 2px solid var(--card-border);
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .system-btn:hover {
      border-color: var(--trimble-blue-light);
      background-color: #F0F4F8;
    }

    .system-btn.active {
      background-color: var(--trimble-blue);
      color: white;
      border-color: var(--trimble-blue);
    }

    .form-section { margin-bottom: 18px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; color: var(--trimble-blue); }
    
    input[type="text"], input[type="email"], input[type="date"], select, textarea { 
      width: 100%; 
      padding: 10px; 
      box-sizing: border-box; 
      margin-bottom: 10px; 
      border: 1px solid #CCC; 
      border-radius: 4px;
      font-size: 14px;
    }

    input[type="text"]:focus, input[type="email"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
      border-color: var(--trimble-blue-light);
      outline: none;
    }

    .required { color: #D93025; }

    .inline-checkbox-label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .search-box {
      margin-bottom: 8px;
      border-color: var(--trimble-blue-light);
    }

    .checkbox-group {
      max-height: 350px;
      overflow-y: auto;
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 4px;
      background: #FAFAFA;
      margin-bottom: 15px;
    }

    .category-block { margin-bottom: 18px; }
    .category-title { font-weight: bold; margin-top: 5px; color: var(--trimble-blue); border-bottom: 2px solid var(--trimble-yellow); padding-bottom: 3px; font-size: 0.95rem; }
    .checkbox-item { font-weight: normal; display: block; margin: 6px 0; color: #333; cursor: pointer; font-size: 0.9rem; }
    .hidden { display: none !important; }

    .product-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      min-height: 32px;
      padding: 6px;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      background: #FAFAFA;
    }
    .product-chip {
      background-color: var(--trimble-blue-light);
      color: white;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .product-chip .remove-chip {
      cursor: pointer;
      font-weight: bold;
      margin-left: 4px;
    }

    .submit-btn { 
      background-color: var(--trimble-yellow); 
      color: var(--trimble-blue); 
      font-weight: bold;
      padding: 12px 20px; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 15px; 
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }

    .submit-btn:hover { background-color: #D99700; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 1rem; }
  </style>
</head>

      </div>

    </form>

    document.addEventListener("DOMContentLoaded", function() {

      fetch(APPS_SCRIPT_URL + "?action=getCustomers")
        .then(res => res.json())
        .then(data => {
          if (data) {
            if (data.truckmate && data.truckmate.length > 0) {
              customerData.truckmate = Array.from(new Set([...defaultTruckmateCustomers, ...data.truckmate])).sort();

    function renderProductCheckboxes() {
      var container = document.getElementById('productChecklist');
      if (!container) return;
      var html = '<div class="category-block"><div class="category-title">All Products & Services</div>';
      tmwMasterProducts.forEach(function(prod) {
        var safeProd = prod.replace(/"/g, '&quot;');
        html += '<label class="checkbox-item"><input type="checkbox" name="tmwProduct" value="' + safeProd + '" onchange="updateProductChips()"> ' + prod + '</label>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function updateProductChips() {
      var container = document.getElementById('selectedProductChips');
      if (!container) return;
      var checkboxes = document.querySelectorAll('input[name="tmwProduct"]:checked');
      if (checkboxes.length === 0) {
        container.innerHTML = '<span style="color:#888; font-size:0.85rem; padding:4px;">No products selected</span>';
        return;
      }
      var html = '';
      checkboxes.forEach(function(cb) {
        var val = cb.value;
        html += '<span class="product-chip">' + val + ' <span class="remove-chip" onclick="removeProductChip(\'' + val.replace(/'/g, "\\'") + '\')">&times;</span></span>';
      });
      container.innerHTML = html;
    }

    function removeProductChip(val) {
      var checkboxes = document.querySelectorAll('input[name="tmwProduct"]');
      checkboxes.forEach(function(cb) {
        if (cb.value === val) {
          cb.checked = false;
        }
      });
      updateProductChips();
    }

    function selectSystem(selection, btnElement) {
      activeSystem = selection;

      document.querySelectorAll('.system-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      var commonFields = document.getElementById('commonFields');
      var tmForm = document.getElementById('truckmateForm');
      var tmwForm = document.getElementById('tmwSuiteForm');
      
      document.getElementById('status').innerText = "";
      document.getElementById('newCustomerGroup').classList.add('hidden');
      document.getElementById('newCustomerInput').value = "";
      document.getElementById('newSubmitterGroup').classList.add('hidden');
      document.getElementById('newSubmitterInput').value = "";
      document.getElementById('submitter').value = "";
      document.getElementById('customerSearch').value = "";

      populateCustomerDropdown(selection);

      if (selection === 'truckmate') {
        commonFields.classList.remove('hidden');
        tmForm.classList.remove('hidden');
        tmwForm.classList.add('hidden');
      } else if (selection === 'tmwsuite') {
        commonFields.classList.remove('hidden');
        tmwForm.classList.remove('hidden');
        tmForm.classList.add('hidden');
      }
    }

    function populateCustomerDropdown(system) {
      var customerDropdown = document.getElementById('customerName');
      customerDropdown.innerHTML = '<option value="">-- Select Customer --</option><option value="__NEW__">+ Add New Customer</option>';
      let list = (system === 'truckmate') ? customerData.truckmate : customerData.tmwsuite;
      list.forEach(c => { customerDropdown.innerHTML += `<option value="${c}">${c}</option>`; });
    }

    function filterCustomerDropdown() {
      var filter = document.getElementById('customerSearch').value.toLowerCase().trim();
      var select = document.getElementById('customerName');
      var options = select.getElementsByTagName('option');

      for (var i = 0; i < options.length; i++) {
        var txt = options[i].text.toLowerCase();
        if (options[i].value === '' || options[i].value === '__NEW__') {
          options[i].style.display = "";
        } else {
          options[i].style.display = (txt.indexOf(filter) > -1) ? "" : "none";
        }
      }
    }

    function handleSubmitterSelectChange() {
      var selectVal = document.getElementById('submitter').value;
      var newGroup = document.getElementById('newSubmitterGroup');
      var newInput = document.getElementById('newSubmitterInput');
      if (selectVal === '__NEW__') {
        newGroup.classList.remove('hidden');
        newInput.required = true;
      } else {
        newGroup.classList.add('hidden');
        newInput.required = false;
        newInput.value = "";
      }
    }

    function handleCustomerSelectChange() {
      var selectVal = document.getElementById('customerName').value;
      var newCustGroup = document.getElementById('newCustomerGroup');
      var newCustInput = document.getElementById('newCustomerInput');
      if (selectVal === '__NEW__') {
        newCustGroup.classList.remove('hidden');
        newCustInput.required = true;
      } else {
        newCustGroup.classList.add('hidden');
        newCustInput.required = false;
        newCustInput.value = "";
      }
    }

    function toggleDbRefreshFields() {
      var isChecked = document.getElementById('dbRefreshCheckbox').checked;
      var dateContainer = document.getElementById('dbRefreshDateContainer');
      var dateInput = document.getElementById('dbRefreshDate');
      if (isChecked) {
        dateContainer.classList.remove('hidden');
        dateInput.required = true;
      } else {
        dateContainer.classList.add('hidden');
        dateInput.required = false;
        dateInput.value = "";
      }
    }

    function filterProducts() {
      var rawInput = document.getElementById('productSearch').value.toLowerCase().trim();
      var terms = rawInput.split(/\s+/).filter(Boolean);
      var items = document.querySelectorAll('#productChecklist .checkbox-item');
      var blocks = document.querySelectorAll('#productChecklist .category-block');

      items.forEach(function(item) {
        var text = (item.textContent || item.innerText).toLowerCase();
        var matchesAllTerms = terms.every(function(term) {
          return text.indexOf(term) > -1;
        });
        item.style.display = matchesAllTerms ? "" : "none";
      });

      blocks.forEach(function(block) {
        var visibleItems = block.querySelectorAll('.checkbox-item:not([style*="display: none"])');
        block.style.display = (visibleItems.length === 0) ? "none" : "";
      });
    }

    function getCommonData() {
      var customerSelect = document.getElementById('customerName').value;
      var finalCustomerName = (customerSelect === '__NEW__') 
        ? document.getElementById('newCustomerInput').value.trim() : customerSelect;
      var submitterSelect = document.getElementById('submitter').value;
      var finalSubmitterName = (submitterSelect === '__NEW__') 
        ? document.getElementById('newSubmitterInput').value.trim() : submitterSelect;

      return {
        submitter: finalSubmitterName,
        customerName: finalCustomerName,
        csm: document.getElementById('csm').value
      };
    }

    function resetFormUI() {
      activeSystem = "";
      document.querySelectorAll('.system-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('commonFields').classList.add('hidden');
      document.getElementById('truckmateForm').classList.add('hidden');
      document.getElementById('tmwSuiteForm').classList.add('hidden');
      var checkboxes = document.querySelectorAll('input[name="tmwProduct"]');
      checkboxes.forEach(function(cb) { cb.checked = false; });
      updateProductChips();
    }

    function submitTruckMate(e) {
      e.preventDefault();
      var statusDiv = document.getElementById('status');
      statusDiv.style.color = "blue";
      statusDiv.innerText = "Submitting TruckMate request...";

      var data = getCommonData();
      data.testUpgradeDate = document.getElementById('testUpgradeDateTm').value;
      data.goLiveDate = document.getElementById('goLiveDate').value;
      data.notes = document.getElementById('tmNotes').value;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => {
            statusDiv.style.color = "green";
            statusDiv.innerText = res;
            document.getElementById('truckmateForm').reset();
            resetFormUI();
          })
          .withFailureHandler(err => {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Error: " + err;
          })
          .processTruckMateForm(data);
      } else {
        fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "processTruckMateForm", data: data }) 
        })
        .then(res => res.json())
        .then(res => {
          statusDiv.style.color = "green";
          statusDiv.innerText = typeof res === 'string' ? res : (res.result || "Success");
        })
        .catch(err => {
          statusDiv.style.color = "red";
          statusDiv.innerText = "Error: " + err.message;
        });
      }
    }
function submitTMWSuite(e) {
  e.preventDefault();

  var statusDiv = document.getElementById('status');
  statusDiv.style.color = "blue";
  statusDiv.innerText = "Submitting TMWSuite request...";

  var data = getCommonData();

  // Checked means DB refresh is NOT required.
  data.dbRefresh = document.getElementById('dbRefreshCheckbox').checked
    ? "No"
    : "Yes";

  data.dbRefreshDate = document.getElementById('dbRefreshDate').value;
  data.discoveryCallDate = document.getElementById('discoveryCallDate').value;

  var selectedProducts = [];
  var checkboxes = document.querySelectorAll('input[name="tmwProduct"]:checked');

  checkboxes.forEach(function(cb) {
    selectedProducts.push(cb.value);
  });

  data.selectedProducts = selectedProducts;

  function resetTMWSuiteForm() {
    document.getElementById('tmwSuiteForm').reset();
    toggleDbRefreshFields();
    updateSelectedProductsUI();
    resetFormUI();
  }

  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        statusDiv.style.color = "green";
        statusDiv.innerText = typeof res === 'string'
          ? res
          : (res.message || res.result || "TMWSuite request submitted successfully.");

        resetTMWSuiteForm();
      })
      .withFailureHandler(function(err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Error: " + err;
        console.error("TMWSuite submission error:", err);
      })
      .processTMWSuiteForm(data);
  } else {
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "processTMWSuiteForm",
        data: data
      })
    })
      .then(function(response) {
        return response.json();
      })
      .then(function(res) {
        // Shows Apps Script errors instead of falsely displaying Success.
        if (res && res.ok === false) {
          throw new Error(res.error || "The TMWSuite request could not be processed.");
        }

        statusDiv.style.color = "green";
        statusDiv.innerText = typeof res === 'string'
          ? res
          : (res.message || res.result || "TMWSuite request submitted successfully.");

        resetTMWSuiteForm();
      })
      .catch(function(err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Error: " + err.message;
        console.error("TMWSuite submission error:", err);
      });
  }
}
