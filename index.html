<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Project Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f6f9;color:#333}
.header{background:#0D2B6B;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.4rem;font-weight:600}
.csm-bar{background:#e8eaf6;padding:8px 24px;font-size:0.9rem;display:none}
.nav{background:#1B3A6B;display:flex;gap:0;overflow-x:auto}
.nav button{background:none;border:none;color:#fff;padding:12px 20px;cursor:pointer;font-size:0.95rem;border-bottom:3px solid transparent}
.nav button.active{border-bottom:3px solid #4FC3F7;font-weight:600}
.tab{display:none;padding:24px;max-width:95%;margin:0 auto}
.tab.active{display:block}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center}
.stat-card h3{font-size:0.85rem;color:#666;margin-bottom:8px;text-transform:uppercase}
.stat-card .value{font-size:1.8rem;font-weight:700;color:#0D2B6B}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-top:16px;}
th{background:#0D2B6B;color:#fff;padding:12px 14px;text-align:left;font-size:0.85rem}
td{padding:12px 14px;border-bottom:1px solid #e5e7eb;font-size:0.9rem}
.error-state{background:#ffebee;color:#c62828;padding:16px;border-radius:8px;margin-bottom:16px;display:none}
.loading{text-align:center;padding:40px;color:#666}
</style>
</head>
<body>

<div class="header">
  <h1 id="portalTitle">QA Project Portal</h1>
</div>
<div class="csm-bar" id="csmBar"></div>

<div class="nav">
  <button class="active" onclick="showTab('home')">Home</button>
  <button onclick="showTab('raid')">RAID Log</button>
  <button onclick="showTab('plan')">Project Plan</button>
  <button onclick="showTab('contacts')">Contacts</button>
</div>

<div class="tab active" id="tab-home">
  <div class="error-state" id="homeError"></div>
  <div class="stat-cards">
    <div class="stat-card"><h3>Go-Live Date</h3><div class="value" id="valGoLive">--</div></div>
    <div class="stat-card"><h3>Days Until Go-Live</h3><div class="value" id="valDays">--</div></div>
    <div class="stat-card"><h3>Temperature</h3><div class="value" id="valTemp">--</div></div>
  </div>
</div>

<div class="tab" id="tab-raid"><div id="raidTableContainer"><div class="loading">Loading RAID data...</div></div></div>
<div class="tab" id="tab-plan"><div id="planTableContainer"><div class="loading">Loading project plan...</div></div></div>
<div class="tab" id="tab-contacts"><div id="contactsTableContainer"><div class="loading">Loading contacts...</div></div></div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const urlParams = new URLSearchParams(window.location.search);
const PORTAL_ID = urlParams.get('portalId');

// ⚠️ PASTE YOUR NEW QA APPS SCRIPT WEB APP URL HERE:
const MASTER_API_URL = "https://script.google.com/macros/s/AKfycbwO7XlRlDjADsHcE42yBPcazR9zR4XzGvbk-aR-PI5_JEo7Weh2Cb2qTbhUi3nFOKdz/exec";

var tabsLoaded = { home: false, raid: false, plan: false, contacts: false };

function apiGet(action, successCb, failureCb) {
  if (!PORTAL_ID) {
    if (failureCb) failureCb({ message: "Missing ?portalId= parameter in URL" });
    return;
  }
  fetch(`${MASTER_API_URL}?portalId=${PORTAL_ID}&action=${action}`)
    .then(res => res.json())
    .then(res => successCb(res))
    .catch(err => { if (failureCb) failureCb(err); });
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  
  document.getElementById('tab-' + name).classList.add('active');
  
  var tabs = ['home','raid','plan','contacts'];
  var idx = tabs.indexOf(name);
  if (idx >= 0) document.querySelectorAll('.nav button')[idx].classList.add('active');
  
  if (name === 'home') loadHome();
  if (name === 'raid') loadRaid();
  if (name === 'plan') loadPlan();
  if (name === 'contacts') loadContacts();
}

function loadHome() {
  apiGet('getPortalData', function(r) {
    var e = document.getElementById('homeError');
    if (!r.ok) {
      if (e) { e.style.display = 'block'; e.textContent = 'Error: ' + (r.error || 'Unknown'); }
      return;
    }
    if (e) e.style.display = 'none';
    document.getElementById('valGoLive').textContent = r.goLiveDate || '--';
    document.getElementById('valDays').textContent = r.daysUntilGoLive !== '' ? r.daysUntilGoLive : '--';
    document.getElementById('valTemp').textContent = r.temperature || '--';
    if (r.customerName) document.getElementById('portalTitle').textContent = r.customerName + ' - QA Portal';
  }, function(err) {
    var e = document.getElementById('homeError');
    if (e) { e.style.display = 'block'; e.textContent = 'Fetch Failed: ' + err.message; }
  });
}

function renderTable(result, containerId) {
  var container = document.getElementById(containerId);
  if (!result.ok || !result.rows || result.rows.length === 0) {
    container.innerHTML = '<p style="padding:20px;">No data available.</p>';
    return;
  }
  var html = '<table><thead><tr>';
  (result.headers || []).forEach(h => { html += '<th>' + escHtml(h) + '</th>'; });
  html += '</tr></thead><tbody>';
  result.rows.forEach(row => {
    html += '<tr>';
    row.forEach(cell => { html += '<td>' + escHtml(cell) + '</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function loadRaid() {
  if (tabsLoaded.raid) return;
  apiGet('getRaidData', function(r) { tabsLoaded.raid = true; renderTable(r, 'raidTableContainer'); });
}

function loadPlan() {
  if (tabsLoaded.plan) return;
  apiGet('getProjectPlanData', function(r) { tabsLoaded.plan = true; renderTable(r, 'planTableContainer'); });
}

function loadContacts() {
  if (tabsLoaded.contacts) return;
  apiGet('getContactsData', function(r) { tabsLoaded.contacts = true; renderTable(r, 'contactsTableContainer'); });
}

document.addEventListener('DOMContentLoaded', function() {
  loadHome();
});
</script>
</body>
</html>
